<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlobeTrotter - Plan New Trip</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/trip.css">
</head>

<body>

<div class="page">

    <div class="trip-card">

        <div class="heading">
            <h1>Where to next?</h1>
            <p>Start your journey by setting the basics.</p>
        </div>

        <form id="tripForm">

            <div class="mb-3">
                <label for="tripName">Trip Name</label>

                <input
                    type="text"
                    id="tripName"
                    class="form-control"
                    placeholder="e.g. Summer in Tuscany, Tokyo Adventure 2026"
                    required>
            </div>


            <div class="row g-3 mb-3">

                <div class="col-6">
                    <label for="startDate">Start Date</label>

                    <div class="date-box">
                        <i class="bi bi-calendar3"></i>

                        <input
                            type="date"
                            id="startDate"
                            class="form-control"
                            required>
                    </div>
                </div>

                <div class="col-6">
                    <label for="endDate">End Date</label>

                    <div class="date-box">
                        <i class="bi bi-calendar3"></i>

                        <input
                            type="date"
                            id="endDate"
                            class="form-control"
                            required>
                    </div>
                </div>

            </div>


            <div class="mb-3">
                <label for="description">
                    Trip Description <span>(Optional)</span>
                </label>

                <textarea
                    id="description"
                    class="form-control"
                    placeholder="What's the vibe of this trip? Any specific goals or places you must visit?"
                ></textarea>
            </div>


            <div class="mb-3">

                <label>Cover Photo</label>

                <label class="upload-box">

                    <input
                        type="file"
                        id="coverPhoto"
                        accept=".png,.jpg,.jpeg,.webp">

                    <i class="bi bi-image"></i>

                    <strong>Click to upload cover photo</strong>

                    <small>PNG, JPG or WebP up to 5MB</small>

                </label>

            </div>


            <div class="privacy-box mb-4">

                <div class="privacy-info">

                    <div class="privacy-icon">
                        <i class="bi bi-lock-fill"></i>
                    </div>

                    <div>
                        <strong>Private Trip</strong>

                        <p>
                            Only you and people you invite can see this trip.
                        </p>
                    </div>

                </div>

                <div class="form-check form-switch">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="privateTrip"
                        checked>
                </div>

            </div>


            <div class="row g-2">

                <div class="col-6">
                    <button
                        type="button"
                        class="discard-btn w-100"
                        onclick="document.getElementById('tripForm').reset()">
                        Discard
                    </button>
                </div>

                <div class="col-6">
                    <button
                        type="submit"
                        class="create-btn w-100">
                        Create Trip Itinerary
                    </button>
                </div>

            </div>

        </form>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="../js/plan_trip.js"></script>

</body>

</html>
