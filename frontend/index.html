<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTrotter</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.css">
    <link rel="stylesheet" href="css/theme.css">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 255px;
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .content {
            flex: 1;
            min-width: 0;
            height: 100vh;
        }

        #moduleFrame {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .nav-link-gt {
            cursor: pointer;
        }

        @media (max-width: 767px) {
            .sidebar {
                width: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <aside class="sidebar d-flex flex-column justify-content-between p-4">

            <div>

                <div class="d-flex align-items-center gap-2 mb-5">
                    <div class="rounded-circle d-flex align-items-center justify-content-center text-white"
                        style="background-color: var(--gt-primary-active); width: 34px; height: 34px;">
                        <i class="bi bi-compass fs-6"></i>
                    </div>

                    <span class="fs-5 gt-brand text-dark">
                        GlobeTrotter
                    </span>
                </div>

                <div class="mb-4">
                    <div class="text-uppercase text-muted fw-bold small mb-2"
                        style="font-size: 0.7rem; letter-spacing: 0.05em;">
                        Explore
                    </div>

                    <nav class="d-flex flex-column gap-1">

                        <a href="pages/dashboard.html" target="moduleFrame" class="nav-link-gt active">
                            <i class="bi bi-grid-fill"></i>
                            <span>Dashboard</span>
                        </a>

                        <a href="pages/my_itineraries.html" target="moduleFrame" class="nav-link-gt">
                            <i class="bi bi-map"></i>
                            <span>My Itineraries</span>
                        </a>

                        <a href="pages/saved_places.html" target="moduleFrame" class="nav-link-gt">
                            <i class="bi bi-bookmark"></i>
                            <span>Saved Places</span>
                        </a>

                        <a href="pages/travel_budget.html" target="moduleFrame" class="nav-link-gt">
                            <i class="bi bi-wallet2"></i>
                            <span>Travel Budget</span>
                        </a>

                    </nav>
                </div>

                <div class="mb-4">
                    <div class="text-uppercase text-muted fw-bold small mb-2"
                        style="font-size: 0.7rem; letter-spacing: 0.05em;">
                        Account
                    </div>

                    <nav class="d-flex flex-column gap-1">

                        <a href="pages/settings.html" target="moduleFrame" class="nav-link-gt">
                            <i class="bi bi-gear"></i>
                            <span>Settings</span>
                        </a>

                        <a href="pages/support.html" target="moduleFrame" class="nav-link-gt">
                            <i class="bi bi-headset"></i>
                            <span>Support</span>
                        </a>

                        <a class="nav-link-gt text-danger opacity-75 logout-btn">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Log Out</span>
                        </a>

                    </nav>
                </div>

            </div>

            <div class="upgrade-box p-3 text-white">

                <div class="mb-2">
                    <i class="bi bi-send-fill fs-4"></i>
                </div>

                <p class="small fw-medium mb-3" style="line-height: 1.35;">
                    Upgrade to Premium for unlimited itineraries & priority support.
                </p>

                <a href="#" class="btn btn-light btn-sm w-100 fw-semibold rounded-pill py-2 text-dark">
                    View Plans
                </a>

            </div>

        </aside>

        <main class="content">
            <iframe id="moduleFrame" name="moduleFrame" src="pages/dashboard.html" title="GlobeTrotter Module">
            </iframe>
        </main>

    </div>

    <script src="js/bootstrap.bundle.min.js"></script>

    <script>
        function loadModule(page) {
            document.getElementById("moduleFrame").src = page;

            document.querySelectorAll(".nav-link-gt").forEach(link => {
                link.classList.remove("active");
            });
        }

        document.querySelectorAll(".nav-link-gt").forEach(link => {
            link.addEventListener("click", function () {
                document.querySelectorAll(".nav-link-gt").forEach(item => {
                    item.classList.remove("active");
                });

                if (this.getAttribute("target") === "moduleFrame") {
                    this.classList.add("active");
                }
            });
        });
    </script>
    <script src="js/auth.js"></script>

</body>

</html>
