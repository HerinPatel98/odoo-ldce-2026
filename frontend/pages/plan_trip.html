<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlobeTrotter - Plan New Trip</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/trip.css">
    <style>
        .upload-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 1rem;
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
            overflow: hidden;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .upload-wrapper:hover {
            border-color: var(--gt-primary-active, #0d9488);
            background-color: #f1f5f9;
        }
        .upload-prompt {
            cursor: pointer;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            text-align: center;
        }
        .preview-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .preview-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .preview-container:hover .preview-overlay {
            opacity: 1;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="trip-card">

        <button
            type="button"
            class="btn btn-light border border-green rounded-pill px-3 mb-3"
            onclick="history.back()">
            <i class="bi bi-arrow-left me-1"></i>
            Back
        </button>

        <div class="heading">
            <h1>Where to next?</h1>
            <p>Start your journey by setting the basics.</p>
        </div>

        <form id="tripForm">

            <div class="mb-3">
                <label for="tripName" class="form-label fw-semibold text-muted small">Trip Name</label>
                <input
                    type="text"
                    id="tripName"
                    class="form-control"
                    placeholder="e.g. Summer in Tuscany, Tokyo Adventure 2026"
                    required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="startDate" class="form-label fw-semibold text-muted small">Start Date</label>
                    <div class="date-box">
                        <i class="bi bi-calendar3"></i>
                        <input
                            type="date"
                            id="startDate"
                            class="form-control"
                            required>
                    </div>
                </div>

                <div class="col-6">
                    <label for="endDate" class="form-label fw-semibold text-muted small">End Date</label>
                    <div class="date-box">
                        <i class="bi bi-calendar3"></i>
                        <input
                            type="date"
                            id="endDate"
                            class="form-control"
                            required>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label fw-semibold text-muted small">
                    Trip Description <span class="text-muted fw-normal">(Optional)</span>
                </label>
                <textarea
                    id="description"
                    class="form-control"
                    rows="3"
                    placeholder="What's the vibe of this trip? Any specific goals or places you must visit?"
                ></textarea>
            </div>

            <!-- Fixed Cover Photo Box Container -->
            <div class="mb-3">
                <label class="form-label fw-semibold text-muted small">Cover Photo</label>
                
                <input
                    type="file"
                    id="coverPhoto"
                    class="d-none"
                    accept=".png,.jpg,.jpeg,.webp">

                <div class="upload-wrapper" id="uploadWrapper">
                    <!-- Default State: Upload Prompt -->
                    <label for="coverPhoto" class="upload-prompt" id="uploadPrompt">
                        <i class="bi bi-image fs-3 text-secondary mb-2"></i>
                        <strong class="small text-dark">Click to upload cover photo</strong>
                        <small class="text-muted" style="font-size: 0.75rem;">PNG, JPG or WebP up to 5MB</small>
                    </label>

                    <!-- Preview State: Hidden Initially -->
                    <div class="preview-container d-none" id="previewContainer">
                        <img id="coverPhotoPreview" alt="Cover photo preview">
                        <div class="preview-overlay">
                            <label for="coverPhoto" class="btn btn-sm btn-light rounded-pill px-3 py-1 fw-semibold small shadow">
                                <i class="bi bi-arrow-repeat me-1"></i> Change
                            </label>
                            <button type="button" class="btn btn-sm btn-danger rounded-pill px-3 py-1 fw-semibold small shadow" id="removePhotoBtn">
                                <i class="bi bi-trash me-1"></i> Remove
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="privacy-box mb-4">
                <div class="privacy-info">
                    <div class="privacy-icon">
                        <i class="bi bi-lock-fill"></i>
                    </div>
                    <div>
                        <strong>Private Trip</strong>
                        <p class="mb-0">Only you and people you invite can see this trip.</p>
                    </div>
                </div>

                <div class="form-check form-switch">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="privateTrip"
                        checked>
                </div>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <button
                        type="button"
                        class="btn btn-light w-100 py-2 border rounded-pill fw-semibold text-dark"
                        id="discardBtn">
                        Discard
                    </button>
                </div>
                <div class="col-6">
                    <button
                        type="submit"
                        class="btn text-white w-100 py-2 rounded-pill fw-semibold"
                        style="background-color: var(--gt-primary-active, #0d9488); border: none;">
                        Create Trip Itinerary
                    </button>
                </div>
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/plan_trip.js"></script>

</body>
</html>
