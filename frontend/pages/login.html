<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlobeTrotter - Login</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

<div class="auth-page">

    <div class="container">

        <!-- Logo -->
        <div class="brand">

            <div class="logo">
                🌍 Globe<span>Trotter</span>
            </div>

            <p>
                Plan. Explore. Experience.
            </p>

        </div>


        <!-- Login Card -->
        <div class="row justify-content-center">

            <div class="auth-column">

                <div class="auth-card">

                    <h1>Welcome Back!</h1>

                    <p class="subtitle">
                        Login to continue your journey
                    </p>

                    <div class="line"></div>


                    <form id="loginForm">


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="loginEmail"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <div class="input-box">

                                <input
                                    type="email"
                                    id="loginEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="loginPassword"
                                class="form-label"
                            >
                                Password
                            </label>

                            <div class="input-box">

                                <input
                                    type="password"
                                    id="loginPassword"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('loginPassword')"
                                >
                                </button>

                            </div>

                        </div>


                        <!-- Remember / Forgot -->

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember"
                                >

                                <label
                                    class="form-check-label"
                                    for="remember"
                                >
                                    Remember me
                                </label>

                            </div>

                            <a
                                href="#"
                                class="auth-link"
                            >
                                Forgot Password?
                            </a>

                        </div>


                        <!-- Login -->

                        <button
                            type="submit"
                            class="btn primary-btn w-100"
                        >
                            Login
                        </button>

                        <!-- Register -->

                        <p class="bottom-text">

                            Don't have an account?

                            <a href="register.html">
                                Sign up
                            </a>

                        </p>

                    </form>

                </div>

            </div>

        </div>


        <!-- Features -->

        <div class="row features">

            <div class="col-12 col-md-4 text-center mb-3">

                <b> Plan Trips</b>

                <small>
                    Create your perfect itinerary
                </small>

            </div>


            <div class="col-12 col-md-4 text-center mb-3">

                <b> Explore Places</b>

                <small>
                    Discover amazing destinations
                </small>

            </div>


            <div class="col-12 col-md-4 text-center mb-3">

                <b> Share & Inspire</b>

                <small>
                    Share your travel plans
                </small>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Custom JS -->

<script src="../js/auth.js"></script>

</body>

</html>
