<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GlobeTrotter - Register</title>


    <!-- Bootstrap 5.3 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>

<div class="auth-page">

    <div class="container">


        <!-- Logo -->

        <div class="brand">

            <div class="logo">
                🌍 Globe<span>Trotter</span>
            </div>

            <p>
                Plan. Explore. Experience.
            </p>

        </div>


        <!-- Register Card -->

        <div class="row justify-content-center">

            <div class="auth-column">

                <div class="auth-card">


                    <h1>
                        Create Account
                    </h1>


                    <p class="subtitle">
                        Start planning your next adventure
                    </p>


                    <div class="line"></div>


                    <form id="registerForm">


                        <!-- Full Name -->

                        <div class="mb-3">

                            <label
                                for="fullName"
                                class="form-label"
                            >
                                Full Name
                            </label>

                            <div class="input-box">

                                <input
                                    type="text"
                                    id="fullName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="registerEmail"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <div class="input-box">

                                <input
                                    type="email"
                                    id="registerEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="registerPassword"
                                class="form-label"
                            >
                                Password
                            </label>

                            <div class="input-box">
                                <input
                                    type="password"
                                    id="registerPassword"
                                    class="form-control"
                                    placeholder="Create a password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('registerPassword')"
                                >
                                </button>

                            </div>

                        </div>


                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label
                                for="confirmPassword"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <div class="input-box">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm your password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('confirmPassword')"
                                >
                                </button>

                            </div>

                        </div>


                        <!-- Password Strength -->

                        <div class="password-strength mb-3">

                            <span id="strengthText">
                                Password strength
                            </span>

                            <div class="strength-bars">

                                <i></i>
                                <i></i>
                                <i></i>
                                <i></i>

                            </div>

                        </div>


                        <!-- Terms -->

                        <div class="form-check mb-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terms"
                            >

                            <label
                                class="form-check-label terms"
                                for="terms"
                            >
                                I agree to the

                                <a href="#">
                                    Terms & Conditions
                                </a>

                                and

                                <a href="#">
                                    Privacy Policy
                                </a>

                            </label>

                        </div>


                        <!-- Register Button -->

                        <button
                            type="submit"
                            class="btn primary-btn w-100"
                        >
                            Sign Up
                        </button>


                        <!-- Login -->

                        <p class="bottom-text">

                            Already have an account?

                            <a href="login.html">
                                Login
                            </a>

                        </p>

                    </form>

                </div>

            </div>

        </div>


        <!-- Features -->

        <div class="row features">

            <div class="col-12 col-md-4 text-center mb-3">

                <b>Plan Trips</b>

                <small>
                    Create your perfect itinerary
                </small>

            </div>


            <div class="col-12 col-md-4 text-center mb-3">

                <b>Explore Places</b>

                <small>
                    Discover amazing destinations
                </small>

            </div>


            <div class="col-12 col-md-4 text-center mb-3">

                <b>Share & Inspire</b>

                <small>
                    Share your travel plans
                </small>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Custom JS -->

<script src="js/auth.js"></script>

</body>

</html>
